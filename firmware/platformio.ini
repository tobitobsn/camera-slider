; PlatformIO Projektkonfiguration
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    teemuatlut/TMCStepper @ ^0.7.3
    gin66/FastAccelStepper @ ^0.31.1
    h2zero/NimBLE-Arduino @ ^2.5.1
build_flags =
    ; qa-report.md BUG-7 (PROJ-3): NimBLE's default of 3 stored bonds evicts
    ; the oldest one once a 4th device pairs (Just Works accepts any pairing
    ; request without confirmation) — three unrelated devices pairing would
    ; silently evict the app's bond, after which every write (STOP included)
    ; fails against the command characteristic's WRITE_ENC requirement until
    ; the user manually removes the pairing in Android's Bluetooth settings.
    ; This is a single-owner device (docs/PRD.md) with exactly one intended
    ; bond, so only one is ever stored — a later pairing attempt is then
    ; simply rejected instead of silently displacing the app's own bond.
    ; Does not affect CONFIG_BT_NIMBLE_MAX_CONNECTIONS (still 3, unchanged —
    ; that one is load-bearing for PROJ-1's BUG-4 fix: a stray *connection*
    ; must not block the app from also connecting and pairing).
    -D CONFIG_BT_NIMBLE_MAX_BONDS=1
